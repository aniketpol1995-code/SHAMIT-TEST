<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b1007">
<title>ShAmit | Royal Wedding Invitation</title>
<style>
:root{
  --orange:#e96b12;--orange2:#ff9a2d;--gold:#e9bd55;--gold-light:#ffe7a0;
  --deep:#2b1007;--cream:#fff2d2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--deep);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
.intro{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#a94b13 0%,#5c260d 48%,#1d0b06 100%)}
.glow{position:absolute;width:min(90vw,760px);height:min(90vw,760px);border-radius:50%;
  background:radial-gradient(circle,#ffd77840 0%,#ff9a2d1a 42%,transparent 70%);filter:blur(12px)}
.frame{position:absolute;inset:clamp(12px,3vw,30px);border:1px solid #e9bd5590;pointer-events:none}
.frame:before{content:"";position:absolute;inset:8px;border:1px solid #e9bd5545}
.arch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(78vw,570px);height:min(90vh,760px);border:5px solid var(--gold);
  border-bottom:0;border-radius:50% 50% 0 0/28% 28% 0 0;
  box-shadow:0 0 0 9px #e9bd5515,0 0 38px #ffbd4b40,inset 0 0 30px #ffbd4b25}
.arch:before{content:"";position:absolute;inset:15px 15px 0;border:1px solid #ffe7a080;
  border-bottom:0;border-radius:50% 50% 0 0/28% 28% 0 0}
.light{position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);
  width:min(54vw,390px);height:min(68vh,540px);border-radius:50% 50% 0 0;
  background:radial-gradient(ellipse at center,#fff1b9 0%,#ffc15a66 34%,#ff8d1c20 65%,transparent 75%);
  filter:blur(12px);opacity:.8;transition:opacity 1.4s ease,transform 1.8s ease}
.doorway{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(62vw,440px);height:min(76vh,640px);border:3px solid var(--gold);
  border-bottom:0;border-radius:50% 50% 0 0/25% 25% 0 0;overflow:hidden;
  box-shadow:0 0 30px #140700aa}
.door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;
  background:linear-gradient(90deg,#6f2608,#d45b0c 18%,#f18a22 48%,#a9430b 100%);
  border:2px solid #f6d477;transition:transform 2.25s cubic-bezier(.72,0,.18,1);z-index:4}
.door.left{left:0;transform-origin:left center;border-right:3px solid #ffdb78}
.door.right{right:0;transform-origin:right center;border-left:3px solid #ffdb78;
  background:linear-gradient(90deg,#a9430b,#f18a22 52%,#d45b0c 82%,#6f2608)}
.door-panel{position:absolute;inset:12px 9px 0;border:2px solid #f7d77d;border-radius:48% 48% 0 0/22% 22% 0 0;
  box-shadow:inset 0 0 0 5px #8a3b0c55,inset 0 0 22px #45170488}
.door-panel:before{content:"";position:absolute;inset:12% 12% 12%;border:1px solid #ffe6a0;border-radius:48% 48% 0 0/20% 20% 0 0}
.door-panel:after{content:"";position:absolute;left:50%;top:26%;width:42%;height:43%;transform:translateX(-50%);
  border:2px solid #f8d77c;border-radius:48% 48% 12% 12%;box-shadow:0 0 0 5px #8d3d0e55,inset 0 0 22px #5a220b88}
.motif{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(2rem,7vw,4rem);
  color:#ffe7a0;text-shadow:0 2px 8px #5a2008;z-index:2}
.knob{position:absolute;top:57%;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3bb,#c48b26 60%,#71400a);
  box-shadow:0 0 8px #ffe39a}
.left .knob{right:12px}.right .knob{left:12px}
.center-seal{position:absolute;z-index:6;left:50%;top:52%;transform:translate(-50%,-50%);
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;text-align:center;
  color:#5b2609;background:radial-gradient(circle,#fff0b9,#dca53e);border:3px double #8b4a0c;
  box-shadow:0 3px 20px #1d0a03;font-size:1.25rem;transition:opacity .45s,transform .6s}
.center-seal small{display:block;font-size:.48rem;letter-spacing:.13em}
.prompt{position:absolute;z-index:8;left:0;right:0;bottom:clamp(26px,7vh,60px);text-align:center;
  padding:0 20px;transition:opacity .45s,transform .45s}
.prompt .eyebrow{font: .65rem Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-light)}
.prompt button{margin-top:15px;border:1px solid var(--gold);border-radius:30px;padding:13px 24px;
  background:#321305aa;color:#fff0c4;letter-spacing:.12em;text-transform:uppercase;font: .68rem Arial,sans-serif;
  cursor:pointer;box-shadow:0 0 18px #ffcf6240}
.prompt button:active{transform:scale(.97)}
.reveal{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-42%);
  text-align:center;padding:25px;opacity:0;transition:opacity 1.4s ease .9s}
.reveal .ganesh{font-size:1.7rem;color:var(--gold-light)}
.reveal .names{font-size:clamp(2.7rem,9vw,5.7rem);line-height:1.08;color:#fff0c7;text-shadow:0 4px 22px #321000}
.reveal .amp{color:var(--gold);font-style:italic}
.reveal p{font: .7rem Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ffe0a0;line-height:1.8}
.next{display:inline-block;margin-top:16px;color:#fff0c7;text-decoration:none;border:1px solid var(--gold);border-radius:24px;padding:11px 20px;font-size:.85rem}
.intro.opened .door.left{transform:perspective(1200px) rotateY(-108deg)}
.intro.opened .door.right{transform:perspective(1200px) rotateY(108deg)}
.intro.opened .center-seal{opacity:0;transform:translate(-50%,-50%) scale(.6)}
.intro.opened .prompt{opacity:0;transform:translateY(20px);pointer-events:none}
.intro.opened .light{opacity:1;transform:translate(-50%,-42%) scale(1.18)}
.intro.opened .reveal{opacity:1}
.hint{position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#e9bd5580;font: .55rem Arial,sans-serif;letter-spacing:.12em;z-index:1}
@media(prefers-reduced-motion:reduce){.door,.light,.reveal,.prompt,.center-seal{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="intro" id="intro">
  <div class="glow"></div><div class="frame"></div><div class="arch"></div><div class="light"></div>
  <div class="doorway" aria-hidden="true">
    <div class="door left"><div class="door-panel"></div><div class="motif">❀</div><div class="knob"></div></div>
    <div class="door right"><div class="door-panel"></div><div class="motif">❀</div><div class="knob"></div></div>
  </div>
  <div class="center-seal">S <span style="color:#9b5b12">&</span> A<small>SHAKALA • AMIT</small></div>
  <div class="reveal">
    <div class="ganesh">ॐ श्री गणेशाय नमः</div>
    <div class="names">Shakala <span class="amp">&</span><br>Amit</div>
    <p>Joyfully invite you to celebrate their wedding<br>29 January 2027 · 12:50 PM</p>
    <a class="next" href="#intro" onclick="return false">Invitation opened ✦</a>
  </div>
  <div class="prompt">
    <div class="eyebrow">A royal celebration awaits</div>
    <button id="openDoor" type="button">✦ &nbsp; Tap to open invitation &nbsp; ✦</button>
  </div>
  <div class="hint">TOUCH OR CLICK THE BUTTON TO OPEN THE PALACE DOORS</div>
</main>
<script>
const intro=document.getElementById('intro');
function openDoors(){if(intro.classList.contains('opened'))return;intro.classList.add('opened');}
document.getElementById('openDoor').addEventListener('click',openDoors);
</script>
</body></html>
