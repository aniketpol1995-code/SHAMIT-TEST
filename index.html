
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Georgia, serif;
            background: #fff8f0;
            color: #654321;
        }

        .invitation {
            padding: 35px 20px;
            max-width: 500px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        .message {
            margin-top: 25px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="invitation">
        <h1>Wedding Invitation</h1>

        <p>
            A beautiful celebration awaits!
        </p>

        <p class="message">
            Our wedding invitation is being prepared.
            Please visit again soon.
        </p>
    </div>
</body>
</html>
